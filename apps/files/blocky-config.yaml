bootstrapDns:
  - upstream: 127.0.0.11

upstreams:
  groups:
    default:
      - unbound
      # Cloudflare
      # - 1.1.1.1
      # - 1.0.0.1
      # Quad9
      # - 9.9.9.9
      # - 149.112.112.112

customDNS:
  customTTL: 5m
  mapping:
    ash.${domain}: ${ash_ip}
    bookmarks.${domain}: ${hickory_ip}
    cherry.${domain}: ${cherry_ip}
    db.${domain}: ${ash_ip}
    glance.${domain}: ${hickory_ip}
    hickory.${domain}: ${hickory_ip}
    home.${domain}: ${maple_ip}
    logs.${domain}: ${hickory_ip}
    maple.${domain}: ${maple_ip}
    rss.${domain}: ${hickory_ip}
    zwave.${domain}: ${maple_ip}

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  clientGroupsBlock:
    default:
      - ads

ports:
  dns: 53
  http: 4000
