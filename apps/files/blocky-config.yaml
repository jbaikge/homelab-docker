upstreams:
  groups:
    default:
      # Cloudflare
      - 1.1.1.1
      - 1.0.0.1
      # Quad9
      - 9.9.9.9
      - 149.112.112.112

customDNS:
  customTTL: 5m
  mapping:
    ash.${domain}: ${ash_ip}
    cherry.${domain}: ${cherry_ip}
    hickory.${domain}: ${hickory_ip}
    maple.${domain}: ${maple_ip}
    zwave.${domain}: ${maple_ip}
    home.${domain}: ${maple_ip}

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
  clientGroupsBlock:
    default:
      - ads

ports:
  dns: 53
  http: 4000
